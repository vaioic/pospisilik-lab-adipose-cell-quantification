[project]
name = "pospisilik-lab-adipose-cell-quantification"
version = "0.1.0"
description = "Counting and measuring size of lipid cells"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "numpy",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "openslide-bin>=4.0.1.2",
    "tqdm>=4.70.0",
    "openslide-python>=1.4.6",
    "scipy>=1.18.0",
    "pandas>=3.0.6",
    "oic-toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = ""

[tool.uv.sources]
oic-toolkit = { path = "../../Toolboxes/oic-toolkit", editable = true }
